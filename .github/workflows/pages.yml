name: Deploy interactive visualization to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install project dependencies
        run: python -m pip install .

      - name: Build interactive visualization
        run: python visualizer.py interactive-visualization --output _site

      - name: Make visualization the Pages index
        shell: bash
        run: |
          set -euo pipefail
          generated="$(find _site -type f -name marked_interactive_selector.html -print -quit)"
          if [[ -z "$generated" ]]; then
            echo "interactive-visualization did not generate marked_interactive_selector.html" >&2
            exit 1
          fi
          cp "$generated" _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
